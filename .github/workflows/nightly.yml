name: Nightly

# Runs CI against the newest compatible dependencies, so breakage from an upstream
# release shows up here before it reaches a pull request. Delete this file if you
# don't want it (make init --minimal does).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: astral-sh/setup-uv@v6
      - name: Upgrade dependencies, keeping vgi-go on its pinned minor
        # The minor comes from go.mod, so this never drifts behind a bump (a stale
        # hard-coded pin once downgraded vgi-go to a release whose core package needs cgo).
        run: |
          vgi_go_minor="$(go list -m -f '{{.Version}}' github.com/Query-farm/vgi-go | cut -d. -f1-2)"
          go get -u ./...
          go get "github.com/Query-farm/vgi-go@${vgi_go_minor}"
          go mod tidy
      - run: make lint test-unit
      - run: make test-sql-all
      - run: make lint-explain
      - name: Open an issue on failure
        if: failure() && vars.RELEASE_WINDOW != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Nightly failed on $(date -u +%F)" \
            --body "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
